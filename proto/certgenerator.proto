syntax = "proto3";

package certgenerator;

message GenerateRequest {
  // OIDC token user to verify the caller's identity.
  string token = 1;
  // The SSH public key to be signed, in OpenSSH format.
  string ssh_public_key = 2;

  // Public key to certify for authenticating to WireGuard gateways, as a PEM
  // encoded PKIX ("PUBLIC KEY") block. Must be ECDSA P-256.
  string tunnel_public_key = 3;
}

message KubernetesClusterCredentials {
  // Cluster name.
  string name = 1;

  // URL at which the cluster API can be reached.
  string server = 2;

  // Server CA certificate (PEM encoded).
  string server_ca = 3;

  // Client CA certificate (PEM encoded).
  string client_ca = 4;

  // Generated client certificate (PEM encoded).
  string client_cert = 5;

  // Key for the generated client certificate (PEM encoded).
  string client_cert_key = 6;
}

// TunnelCredentials is the credential used to authenticate against a WireGuard
// gateway, identifying the holder as a specific person (email).
message TunnelCredentials {
  // Client certificate (PEM encoded) for the key in
  // GenerateRequest.tunnel_public_key, with the user's email as its common
  // name.
  string client_cert = 1;

  // The CA that issued client_cert (PEM encoded).
  string ca = 2;
}

message GenerateResponse {
  // Signed SSH certificate, in OpenSSH format.
  string ssh_cert = 1;

  repeated KubernetesClusterCredentials kubernetes_credentials = 2;

  // Credentials for authenticating to WireGuard gateways. Unset if the server
  // has no tunnel CA configured.
  TunnelCredentials tunnel_credentials = 3;
}

// Service responsible for generating short-lived user certificates.
service CertGenerator {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
}
