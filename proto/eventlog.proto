syntax = "proto3";

import "proto/context.proto";
import "proto/invocation_status.proto";
import "github.com/planetscale/vtprotobuf/vtproto/ext.proto";

package eventlog;

option go_package = "proto;eventlog";

enum LogType {
  UNKNOWN_LOG = 0;
  // Build logs streamed from the build event stream.
  BUILD_LOG = 1;
  // Run logs from executing the binary associated with a build.
  RUN_LOG = 2;
  // The three logs below hold the output of a producer that tells its streams
  // apart, such as a remote runner. BUILD_LOG keeps the merged view.
  //
  // The stdout of the command the producer ran.
  STDOUT_LOG = 3;
  // The producer's own narration, so a reader can filter it out. Also
  // interleaved into STDERR_LOG, which is where it is meant to be shown.
  NARRATION_LOG = 4;
  // The stderr of the command the producer ran, with narration interleaved.
  STDERR_LOG = 5;
}

message GetEventLogChunkRequest {
  // The request context.
  context.RequestContext request_context = 1;

  // The invocation identifier itself.
  string invocation_id = 2;

  // Optionally specify the chunk to be returned; gets the last chunk if empty
  string chunk_id = 3;

  // Specify fewest lines that may be returned; additional chunks may be read
  // to meet this requirement. If no more chunks are available to be read and
  // this requirement is still not satisfied, the buffer will instead contain as
  // many lines as are available.
  int32 min_lines = 4;

  LogType type = 5;
}

message GetEventLogChunkResponse {
  // The response context.
  context.ResponseContext response_context = 1;

  // The surrounding chunk ids. Empty if no such chunk exists
  string previous_chunk_id = 2;
  string next_chunk_id = 3;

  // The requested log data
  bytes buffer = 4;

  // If the chunk is "live", i.e. not yet written to disk and subject to change.
  bool live = 5;

  // Which log this chunk was served from. A server predating the split types
  // leaves this unset and serves the build log for any type it does not
  // recognize, so a client can tell the difference.
  LogType served_type = 6;
}

message LiveEventLogChunk {
  option (vtproto.mempool) = true;
  // The chunk id that this data will eventually be written to.
  // Technically, when written the tail could span to the following chunk, but
  // that is not relevant for our purposes here.
  string chunk_id = 1;

  // The cached log data
  bytes buffer = 2;
}

message LogMetadata {
  string invocation_id = 1;
}

message WriteEventLogRequest {
  context.RequestContext request_context = 1;

  LogType type = 2;

  LogMetadata metadata = 3;

  bytes data = 4;
}

message WriteEventLogResponse {
  context.ResponseContext response_context = 1;
}

message UpdateRunStatusRequest {
  context.RequestContext request_context = 1;

  string invocation_id = 2;

  invocation_status.OverallStatus status = 3;
}

message UpdateRunStatusResponse {
  context.ResponseContext response_context = 1;
}
