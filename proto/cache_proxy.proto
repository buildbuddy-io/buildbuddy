syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "proto/acl.proto";
import "proto/context.proto";
import "proto/upgrade.proto";

package cache_proxy;

// CacheProxySummary is a summary of a cache proxy's state.
message CacheProxySummary {
  // The host on which the cache proxy is running (typically the machine's
  // hostname or kubernetes pod name).
  //
  // Ex. "10.52.6.5" or "cache-proxy-abc123"
  string host = 1;

  // Unique ID identifying this cache proxy process. Set once when the cache
  // proxy process starts and preserved for its lifetime. Each new cache proxy
  // process generates its own unique ID on startup.
  //
  // Ex. "34c5cf7e-b3b1-4e20-b43c-3e196b30d983"
  string proxy_id = 2;

  // Unique ID identifying the host the cache proxy is running on. Persists
  // across cache proxy processes running on the same host (in most cases).
  //
  // Ex. "23894af6-a540-430a-962e-a14b1f398472"
  string proxy_host_id = 3;

  // The cache proxy's operating system family. One of: "darwin", "linux", or
  // "windows".
  string os_family = 4;

  // Architecture of the cache proxy. Usually one of: "amd64" or "arm64".
  string arch = 5;

  // Version of the cache proxy binary, formatted as a semver with a "v" in
  // front, e.g. "v2.301.0".
  string version = 6;

  // Time when this cache proxy process started.
  google.protobuf.Timestamp start_time = 7;

  // Optional set of key-value labels identifying this cache proxy. These labels
  // can be used to identify cache proxies by the cloud, cluster, region, or
  // zone where they're running, their deployment or experimental configuration
  // (for example, canaries), or other operationally relevant information.
  map<string, string> labels = 8;

  // CPU allocated to this cache proxy process, in milliCPU (1000 == 1 core).
  int64 allocated_cpu_millis = 9;

  // Memory allocated to this cache proxy process, in bytes.
  int64 allocated_memory_bytes = 10;

  // The flags this cache proxy was configured with (via the command line or
  // config file), in "--name=value" form. Only flags set to non-default
  // values are included, and the values of secret flags are redacted.
  //
  // TODO(go/b/8433): remove this field.
  repeated string configured_flags = 11;

  // The last time this cache proxy checked in with the server.
  google.protobuf.Timestamp last_check_in_time = 12;
}

// CacheProxyDetails contains details about a cache proxy's state. The summary
// is contained in and always returned with the details, but other fields are
// optional and only returned when requested.
message CacheProxyDetails {
  CacheProxySummary summary = 1;

  // The flags this cache proxy was configured with (via the command line or
  // config file), in "--name=value" form. Only flags set to non-default
  // values are included, and the values of secret flags are redacted.
  repeated string configured_flags = 2;

  // Statistics about this cache proxy's performance.
  Statistics statistics = 3;
}

// Statistics about this cache proxy's performance. Cumulative over the
// lifetime of this cache proxy process.
message Statistics {
  // Read statistics — broken out by hit/miss.
  int64 ac_read_hits = 1;
  int64 ac_read_misses = 2;
  int64 ac_read_uncacheable = 13;
  int64 ac_read_hit_bytes = 3;
  int64 ac_read_miss_bytes = 4;
  int64 ac_read_uncacheable_bytes = 14;
  int64 cas_read_hits = 5;
  int64 cas_read_misses = 6;
  int64 cas_read_uncacheable = 15;
  int64 cas_read_hit_bytes = 7;
  int64 cas_read_miss_bytes = 8;
  int64 cas_read_uncacheable_bytes = 16;

  // Write statistics.
  int64 ac_writes = 9;
  int64 ac_write_bytes = 10;
  int64 cas_writes = 11;
  int64 cas_write_bytes = 12;
}

// RegisterCacheProxyRequest is sent on the stream from the proxy to the server.
// It is sent in response to the initial connection, as a periodic heartbeat,
// and in response to GetCacheProxyResponses from the server.
message RegisterCacheProxyRequest {
  // TODO(go/b/8433): remove (use the summary in "details" instead)
  CacheProxySummary summary = 1;
  CacheProxyDetails details = 4;

  // TODO(go/b/8433): remove
  Statistics statistics = 2;

  // When true, the cache proxy is shutting down cleanly and the server should
  // remove this cache proxy from its registry immediately rather than waiting
  // for the heartbeat staleness TTL.
  bool shutting_down = 3;

  // When this message answers a RegisterCacheProxyResponse from the server,
  // this will be the request_id from that RegisterCacheProxyResponse. Empty for
  // heartbeats.
  string request_id = 5;
}

// RegisterCacheProxyResponse is sent on the stream from the server to the
// proxy to request information from the proxy.
message RegisterCacheProxyResponse {
  // Set when the server is requesting details from the proxy. The proxy answers
  // with a RegisterCacheProxyRequest with the requested details fields set. The
  // "selector" field of this GetCacheProxyRequest is ignored.
  GetCacheProxyRequest details_request = 1;

  // A unique (within the stream) identifier for this request. This is necessary
  // because the registration stream contains heartbeat updates along with
  // details requests, and the registry server may not be able to distinguish
  // between them. The request_id lets the registration server associate the
  // details it receives with the response message it sent requesting them (and
  // this, the request it is serving).
  string request_id = 2;
}

// TODO(go/b/8433): remove
message GetCacheProxiesRequest {
  context.RequestContext request_context = 1;
}

// TODO(go/b/8433): remove
message GetCacheProxiesResponse {
  context.ResponseContext response_context = 1;

  repeated CacheProxy cache_proxy = 2;

  message CacheProxy {
    CacheProxySummary summary = 1;

    // Last time this cache proxy checked in with the server.
    google.protobuf.Timestamp last_check_in_time = 2;

    // Statistics about this cache proxy's performance.
    Statistics statistics = 3;
  }

  upgrade.Prompt upgrade_prompt = 3;
}

// ListCacheProxiesRequest and ListCacheProxiesResponse are used to list all
// cache proxies running under a provided RequestContext.
message ListCacheProxiesRequest {
  context.RequestContext request_context = 1;
}

message ListCacheProxiesResponse {
  context.ResponseContext response_context = 1;

  repeated CacheProxySummary summary = 2;

  upgrade.Prompt upgrade_prompt = 3;
}

// CacheProxySelector selects a single cache proxy for retrieval via the
// details-fetching GetCacheProxy RPC.
message CacheProxySelector {
  // The proxy_id of the cache proxy to fetch. See CacheProxySummary for a
  // description of the proxy_id.
  string proxy_id = 1;
}

// GetCacheProxyRequest and GetCacheProxyResponse are used to fetch details
// about a single cache proxy.
message GetCacheProxyRequest {
  context.RequestContext request_context = 1;

  CacheProxySelector selector = 2;

  // Whether to include the cache proxy's configured flags in the response.
  bool include_configured_flags = 3;

  // Whether to include the cache proxy's statistics in the response.
  bool include_statistics = 4;
}

message GetCacheProxyResponse {
  context.ResponseContext response_context = 1;

  CacheProxyDetails details = 2;

  upgrade.Prompt upgrade_prompt = 3;
}

// Persisted information about a connected cache proxy.
message RegisteredCacheProxy {
  CacheProxySummary summary = 1;
  string group_id = 2;
  acl.ACL acl = 3;
  google.protobuf.Timestamp last_ping_time = 4;
  Statistics statistics = 5;
}

// CacheProxyRegistry runs on the main BuildBuddy app and tracks the set of
// live cache proxies for each group, so the deployment view can list them.
service CacheProxyRegistry {
  // RegisterAndStreamHeartbeat is opened by the cache proxy on startup. The
  // cache proxy sends an initial RegisterCacheProxyRequest with its identifying
  // info, then re-sends the same message periodically as a heartbeat. The
  // server uses these heartbeats to maintain a TTL-backed registry of live
  // cache proxies, scoped to the group identified by the proxy's API key.
  //
  // While the stream is open, the server may send RegisterCacheProxyResponses
  // to request information from the cache proxy, which the cache proxy
  // answers with RegisterCacheProxyRequests.
  rpc RegisterAndStreamHeartbeat(stream RegisterCacheProxyRequest)
      returns (stream RegisterCacheProxyResponse) {}
}
