syntax = "proto3";

import "google/longrunning/operations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/rpc/status.proto";
import "proto/acl.proto";
import "proto/context.proto";
import "proto/invocation_status.proto";
import "proto/remote_execution.proto";
import "proto/scheduler.proto";
import "proto/stat_filter.proto";

package execution_stats;

// Proto representation of the rusage struct used in the Linux/BSD getrusage()
// system call.
message Rusage {
  // ru_utime: Amount of CPU time in seconds spent in userspace.
  int64 user_cpu_time_usec = 1;

  // ru_stime: Amount of CPU time in seconds spent in kernelspace.
  int64 sys_cpu_time_usec = 2;

  // ru_maxrss: Maximum amount of resident memory in bytes.
  int64 max_resident_set_size_bytes = 3;

  // ru_minflt: Page reclaims.
  int64 page_reclaims = 4;

  // ru_majflt: Page faults.
  int64 page_faults = 5;

  // ru_nswap: Number of swaps.
  int64 swaps = 6;

  // ru_inblock: Block input operations.
  int64 block_input_operations = 7;

  // ru_oublock: Block output operations.
  int64 block_output_operations = 8;

  // ru_msgsnd: Messages sent.
  int64 messages_sent = 9;

  // ru_msgrcv: Messages received.
  int64 messages_received = 10;

  // ru_nsignals: Signals received.
  int64 signals_received = 11;

  // ru_nvcsw: Voluntary context switches.
  int64 voluntary_context_switches = 12;

  // ru_nivcsw: Involuntary context switches.
  int64 involuntary_context_switches = 13;
}

// Next Tag: 20
message Execution {
  reserved 4, 10;
  // The digest of the [Action][build.bazel.remote.execution.v2.Action] to
  // execute.
  build.bazel.remote.execution.v2.Digest action_digest = 1;

  // The digest of the [Action][build.bazel.remote.execution.v2.Action] to
  // execute.
  // When an action succeeds, this field is the same as the action_digest; when
  // an action fails, this field contains the result details and action_digest
  // doesn't.
  build.bazel.remote.execution.v2.Digest action_result_digest = 9;

  // A digest used to retrieve the
  // [build.bazel.remote.execution.v2.ExecuteResponse] produced by the executor
  // for the latest attempt of this execution.
  //
  // This digest can be used to fetch a specially formatted ActionResult from
  // the Action Cache. In particular, the ActionResult's stdout_raw field is set
  // to the marshaled ExecuteResponse bytes.
  build.bazel.remote.execution.v2.Digest execute_response_digest = 12;

  // Inlined ExecuteResponse, if requested.
  build.bazel.remote.execution.v2.ExecuteResponse execute_response = 13;

  // The stage this execution is currently in.
  build.bazel.remote.execution.v2.ExecutionStage.Value stage = 2;

  // The Status of this execution (if it has finished).
  google.rpc.Status status = 3;

  // Estimated task size that was used for scheduling purposes.
  scheduler.TaskSize task_size = 11;

  // Execution stage timings.
  build.bazel.remote.execution.v2.ExecutedActionMetadata
      executed_action_metadata = 5;

  // Permissions for this execution.
  acl.ACL acl = 6;

  // A snippet of the command that ran as part of this execution.
  // Ex. /usr/bin/gcc foo.cc -o foo
  string command_snippet = 7;

  // The exit code of the command. Should be ignored if status != OK.
  int32 exit_code = 8;

  // The identifier of the scheduled execution. Note that if an execution is
  // retried internally, this Execution will reflect the latest execution
  // attempt.
  string execution_id = 14;

  // The target label associated with the execution.
  string target_label = 15;

  // The action mnemonic associated with the execution (a short string
  // describing the action being executed).
  string action_mnemonic = 17;

  // The primary output path associated with the execution, if any.
  string primary_output_path = 18;

  // The executor hostname that ran the execution. This is only populated if the
  // user has permission to view the executor metadata.
  string executor_hostname = 16;

  // Type from stored_invocation.StoredInvocationLink.
  int32 invocation_link_type = 19;
}

// Auxiliary metadata with BuildBuddy-specific information. Stored in
// ExecutedActionMetadata.auxiliary_metadata.
message ExecutionAuxiliaryMetadata {
  // Platform overrides set via remote header.
  build.bazel.remote.execution.v2.Platform platform_overrides = 1;

  // The effective isolation type. Usually either user requested or the
  // default.
  string isolation_type = 2;

  build.bazel.remote.execution.v2.ExecuteRequest execute_request = 3;

  scheduler.SchedulingMetadata scheduling_metadata = 4;

  // The effective action timeout. Either user requested or the default.
  google.protobuf.Duration timeout = 6;

  string executor_hostname = 7;

  repeated string experiments = 8;

  // The timestamp at which the task was locally enqueued on the worker.
  google.protobuf.Timestamp worker_queued_timestamp = 9;

  // Metadata about the runner assigned to process the task.
  RunnerMetadata runner_metadata = 10;

  // Metadata containing more detail about the input fetch phase of execution.
  InputFetchMetadata input_fetch_detailed_stats = 11;

  // Metrics reported by the guest VM which executed this action.
  VMMetrics vm_metrics = 12;

  // The digest of a CAS blob listing the input files that the action did not
  // open while running on a VFS-backed workspace, in the format described by
  // ExecutionTask.vfs_unused_inputs_digest. Only set for tasks whose
  // vfs-prefetch-mode platform property is "used".
  build.bazel.remote.execution.v2.Digest vfs_unused_inputs_digest = 13;

  // Statistics about the VFS that served the action's inputs, if the action
  // ran with VFS enabled, including how many inputs were prefetched and how
  // many were downloaded lazily.
  build.bazel.remote.execution.v2.VfsStats vfs_stats = 14;
}

// Metrics associated with the guest VM which executed an action. Mostly
// reported by the guest's vmexec server; some fields are measured by the
// executor.
message VMMetrics {
  // Time the guest spent waiting for dockerd to become ready. Zero if
  // dockerd initialization was not requested.
  int64 dockerd_wait_duration_usec = 1;

  // Time the guest spent waiting for the VM's local DNS server to become
  // ready. Zero if no DNS overrides were configured.
  int64 vm_dns_wait_duration_usec = 2;

  // Time from when the guest's vmexec process started until its gRPC server
  // was about to begin serving. Includes the waits above, but not earlier
  // guest init (kernel boot or init process setup).
  int64 vm_exec_init_duration_usec = 3;

  // Time the executor spent dialing the guest's vmexec server, measured on
  // the host. For executions that booted a fresh VM, this includes guest boot
  // up to the point where the vmexec server was serving. Unlike the boot
  // timings above, this is set for every execution, since the connection is
  // re-established for each task.
  int64 vm_exec_dial_duration_usec = 4;

  // Time spent on the successful host-to-guest gRPC transport dial, excluding
  // any time waiting for a guest-triggered readiness signal.
  int64 vm_exec_transport_dial_duration_usec = 5;

  // Number of host-to-guest transport connection attempts made while dialing
  // vmexec.
  int64 vm_exec_dial_attempts = 6;

  // Whether the executor received a guest-triggered vmexec readiness signal
  // before dialing.
  bool vm_exec_ready_signal_received = 7;
}

// Stats about work done after the COMPLETED operation is streamed back to the
// client. Stored in ExecutedActionMetadata.auxiliary_metadata.
message PostCompletionStats {
  // Wall-clock time spent in Container.Pause. For VMs, this includes snapshot
  // creation, chunk uploads, and VM teardown.
  int64 pause_duration_usec = 1;

  // Firecracker-specific post-execution stats. Nil for non-firecracker runners.
  FirecrackerPostExecStats firecracker_post_exec_stats = 2;

  // Disk space used by the task's workspace (buildroot), in bytes, measured
  // just before the workspace is cleaned up. This is the logical (apparent)
  // size summed across the workspace tree. Only populated when
  // executor.workspace.measure_disk_usage is enabled, and not populated for
  // VM-based runners. Measured off the task's critical path, so it does not add
  // latency to task completion.
  int64 buildroot_disk_usage_bytes = 3;
}

message FirecrackerPostExecStats {
  // Whether the snapshot was actually saved to the local cache. This is the
  // resolved value after Pause, not the prediction reported in VMMetadata
  // before Pause runs.
  bool snapshot_saved_locally = 1;

  // Whether the snapshot was actually saved to the remote cache.
  bool snapshot_saved_remotely = 2;

  // Whether the saved snapshot was a diff snapshot (vs full).
  bool snapshot_is_diff = 3;

  // Total uncompressed bytes written for the snapshot. For diff snapshots,
  // this counts only the modified chunks (i.e. the bytes that materially
  // changed since the base snapshot).
  int64 snapshot_saved_bytes = 4;
}

message RunnerMetadata {
  // Runner unique ID.
  string runner_id = 1;

  // The number of the tasks that were ever assigned to the runner this task was
  // assigned to, including this task. This is not currently populated for
  // Firecracker runners.
  //
  // Example: if this is 1, then the task associated with this RunnerMetadata
  // was the first task assigned to the runner.
  //
  // In rare cases, a task may be canceled and the runner may be returned to the
  // pool before a task is executed. But generally speaking, if this number if
  // >= 2, it roughly indicates that the task was assigned to a "warm" runner.
  int64 task_number = 2;

  // The hash of the platform proto. This is part of the runner key and
  // determines whether a task can be assigned to a runner in the runner pool.
  // TODO: see whether we can just store the full platform in the DB - it'd be
  // nice to be able to query this.
  string platform_hash = 3;

  // Persistent worker key (the 'persistentWorkerKey' platform property). This
  // is part of the runner key and determines whether a persistent worker action
  // can be assigned to a runner in the runner pool.
  string persistent_worker_key = 4;
}

message InputFetchMetadata {
  // Serialized roaring bitmap. Set bits correspond to leaf file indices in a
  // deterministic order: files first, in the order they are listed in each
  // Directory message, then leaf files from each child directory,
  // recursively, in the order the child directories are listed in each
  // Directory message.
  bytes downloaded_file_indices_bitmap = 1;
}

message ExecutionLookup {
  // The invocation_id associated with the execution.
  string invocation_id = 1;

  // Optional action digest filter. Only the executions for this action digest
  // will be returned.
  string action_digest_hash = 2;

  // Optional execution ID. Only the specific execution with this ID will be
  // returned.
  string execution_id = 3;

  // Optional target label filter. Only executions for this target will be
  // returned (exact match). Ex: "//foo/bar:baz"
  string target_label = 4;
}

message GetExecutionRequest {
  context.RequestContext request_context = 1;

  ExecutionLookup execution_lookup = 2;

  // Fetch the ExecuteResponse from cache for each execution and include it in
  // the response if it is available.
  bool inline_execute_response = 3;
}

message GetExecutionResponse {
  context.ResponseContext response_context = 1;

  repeated Execution execution = 2;
}

message WaitExecutionRequest {
  context.RequestContext request_context = 1;

  string execution_id = 2;
}

message WaitExecutionResponse {
  context.ResponseContext response_context = 1;

  google.longrunning.Operation operation = 2;
}

message ExecutionQuery {
  // The unix-user who performed the build.
  string invocation_user = 1;

  // The host this build was executed on.
  string invocation_host = 2;

  // The git repo the build was for.
  string repo_url = 3;

  // The commit sha used for the build.
  string commit_sha = 4;

  // The ROLE metadata set on the build. If multiple filters are specified, they
  // are combined with "OR".
  repeated string role = 5;

  // The timestamp on or after which the execution was last updated (inclusive).
  google.protobuf.Timestamp updated_after = 6;

  // The timestamp up to which the execution was last updated (exclusive).
  google.protobuf.Timestamp updated_before = 7;

  // Status of the build. If multiple are specified, they are combined with
  // "OR".
  repeated invocation_status.OverallStatus invocation_status = 8;

  // The git branch used for the build.
  string branch_name = 9;

  // The bazel command that was used. Ex: "build", "test", "run"
  string command = 10;

  // The pattern for the targets built (exact match). Ex: "//..."
  string pattern = 11;

  // Stat filters (duration_usec, queue_time_usec, etc.)
  repeated stat_filter.StatFilter filter = 12;

  // String-based dimensional filters (execution worker, branch, etc.)
  repeated stat_filter.DimensionFilter dimension_filter = 14;

  // New, robust filters that will eventually replace all other fields.
  repeated stat_filter.GenericFilter generic_filters = 15;

  // Plaintext tags for the invocation (exact match). Ex: "my-cool-tag"
  repeated string tags = 13;
}

// Searches executions data for all matching executions.  This request is
// automatically filtered to only return readable executions for the user's
// currently selected group.
message SearchExecutionRequest {
  context.RequestContext request_context = 1;

  ExecutionQuery query = 2;

  // The number of results to return. Optional.
  // If unset, the server will pick a reasonable page size.
  int32 count = 3;

  // The next_page_token value returned from a previous request, if any.
  string page_token = 4;
}

message InvocationMetadata {
  // The invocation identifier itself.
  string id = 1;

  // The unix-user who performed this invocation.
  string user = 2;

  // The host this invocation was executed on.
  string host = 3;

  // The build patterns specified for this invocation.
  string pattern = 4;

  // The role played by this invocation. Ex: "CI"
  string role = 5;

  // The name of the git branch for this invocation, if any
  string branch_name = 6;

  // The commit SHA that this invocation was for.
  string commit_sha = 7;

  // A URL to the git repo this invocation was for.
  string repo_url = 8;

  // The command performed (usually "build" or "test").
  string command = 9;

  // Whether or not the invocation was successful
  bool success = 10;

  // The current status of the invocation.
  invocation_status.InvocationStatus invocation_status = 11;
}

message ExecutionWithInvocationMetadata {
  Execution execution = 1;
  InvocationMetadata invocation_metadata = 2;
}

message SearchExecutionResponse {
  context.ResponseContext response_context = 1;

  repeated ExecutionWithInvocationMetadata execution = 2;

  // Token to retrieve the next page of results, or empty if there are no
  // more results in the list.
  string next_page_token = 3;
}
