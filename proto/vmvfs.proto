syntax = "proto3";

package vmvfs;

import "proto/remote_execution.proto";

// Set up the FUSE filesystem.
message PrepareRequest {
  // Run the VFS namespace server in the guest. Input metadata and contents are
  // fetched from the host using GetTree and ByteStream respectively.
  bool use_guest_server = 1;
  string remote_instance_name = 2;
  build.bazel.remote.execution.v2.Digest input_root_digest = 3;
  build.bazel.remote.execution.v2.DigestFunction.Value digest_function = 4;
  string working_directory = 5;
  repeated string output_directories = 6;
  repeated string output_files = 7;
  repeated string output_paths = 8;
  bool profile_preparation = 9;
  // Where the guest server gets the contents of CAS inputs, and how: one of
  // "remote", "filecache", "raw" or "direct". Empty means "remote".
  string content_mode = 10;
  // Tell the guest kernel not to send FLUSH when closing CAS inputs, which
  // have nothing to flush.
  bool no_flush_inputs = 11;
  // If set, the readahead window of the FUSE mount in KiB. FUSE caps a
  // buffered read request at the readahead window, which defaults to 128.
  int32 fuse_read_ahead_kb = 12;
  // If set, the share of the dirty page limit, in percent, that the FUSE
  // mount may use. Linux caps a FUSE mount at 1% by default, which makes
  // the kernel write back almost as soon as a program writes.
  int32 fuse_max_dirty_ratio = 13;
  // Send every change to the contents of a file the action writes to the
  // host as it happens, keyed by the file's node ID, so that the host has
  // the action's outputs when it finishes.
  bool mirror_writes = 14;
  // Record a CPU profile of the guest VFS process from the end of this call
  // until Finish, which returns it.
  bool profile_task = 15;
  // Read input contents from the host with blocking system calls instead of
  // through the Go network poller.
  bool blocking_content_reads = 16;
}

message PrepareResponse {
  int64 get_tree_duration_usec = 1;
  int64 namespace_prepare_duration_usec = 2;
  bytes preparation_cpu_profile = 3;
  // How long the whole call took in the guest, and its other steps, which
  // are dialing the host, validating the tree, and telling the kernel to
  // drop what it cached of the previous task's files.
  int64 total_duration_usec = 4;
  int64 dial_duration_usec = 5;
  int64 validate_duration_usec = 6;
  int64 kernel_invalidate_duration_usec = 7;
  // What the server process did between the end of the last Finish call and
  // the start of this call, and during this call, as "name=value" pairs of
  // the counters that FinishResponse.server_stats has.
  string idle_stats = 8;
  string prepare_stats = 9;
}

// Indicates that the FUSE filesystem is no longer needed.
// All remote IO will fail until the next Prepare call.
message FinishRequest {
  // Report the CAS inputs that nothing opened since the last Prepare call
  // in the response.
  bool report_unused_inputs = 1;
  // Experiment: close the server's connections to the host at the end of
  // this call, so that none is open while the VM is paused.
  bool close_host_connections = 2;
}

message Stats {
  int64 read_io_bytes = 1;
  int64 write_io_bytes = 2;
}

// How many FUSE requests of a kind the guest VFS handled, and how long it
// spent handling them in total.
message FuseOpStats {
  string op = 1;
  int64 count = 2;
  int64 duration_usec = 3;
}

message FinishResponse {
  // Stats for activity since the last Prepare call.
  Stats stats = 1;
  // Files written to the CAS matching the output_files set in the layout.
  repeated build.bazel.remote.execution.v2.OutputFile output_files = 2;
  // Files written to the CAS under any of the directories in the layout
  // output_directories list.
  repeated build.bazel.remote.execution.v2.OutputDirectory output_directories =
      3;
  // The gRPC code and message of the first input error that the guest VFS
  // server hit since the last Prepare call, or 0 if there was none.
  int32 task_error_code = 4;
  string task_error_message = 5;
  // The CAS inputs that nothing opened since the last Prepare call, when the
  // request asked for them.
  build.bazel.remote.execution.v2.TreeMask unused_inputs = 6;
  // The FUSE requests that the guest VFS handled since the last Prepare call,
  // for finding out where an action's time goes.
  repeated FuseOpStats fuse_op_stats = 7;
  // The requests for input contents that the guest VFS sent to the host since
  // the last Prepare call, the bytes they returned, how long they took in
  // total and how many of them had to open a new connection.
  int64 content_requests = 8;
  int64 content_bytes = 9;
  int64 content_usec = 10;
  int64 content_dials = 11;
  // The CPU profile of the guest VFS process since Prepare, if the Prepare
  // request asked for one.
  bytes task_cpu_profile = 12;
  // The content requests by how long they took. Entry 0 covers requests
  // that took under 32 microseconds, and entry i covers those that took at
  // least 32 << (i - 1) microseconds and less than twice that. Each entry
  // has how many requests there were, how long they took in total and how
  // many bytes they returned.
  repeated int64 content_time_counts = 13;
  repeated int64 content_time_usec = 14;
  repeated int64 content_time_bytes = 15;

  // How much the server process's CPU time, page faults, context switches
  // and garbage collection counters grew since the last Prepare call, and
  // its heap size, as space-separated NAME=VALUE pairs.
  string server_stats = 16;
}

message ReadOutputsRequest {
  // Send the contents of the files the action wrote. Without it, the host
  // must already have them, from mirror_writes.
  bool send_contents = 1;
}

// A file, directory or symlink under one of the action's output paths.
message OutputEntry {
  enum Type {
    UNKNOWN = 0;
    FILE = 1;
    DIRECTORY = 2;
    SYMLINK = 3;
  }
  // Relative to the workspace root, with directories before their contents.
  string path = 1;
  Type type = 2;
  uint32 perms = 3;
  string symlink_target = 4;
  // The size of a file.
  int64 size = 5;
  // Set for an input file the action did not replace, which the host can
  // take from its file cache.
  build.bazel.remote.execution.v2.Digest input_digest = 6;
  // For a file the action wrote, the node ID that mirrored writes used.
  uint64 node_id = 7;
}

message ReadOutputsResponse {
  // Set in the first message for each entry.
  OutputEntry entry = 1;
  // The next part of the current file's contents, if send_contents is set.
  bytes data = 2;
}

message UploadOutputsRequest {}

message UploadOutputsResponse {
  // The action result with only its output fields set.
  build.bazel.remote.execution.v2.ActionResult action_result = 1;
  int64 file_count = 2;
  int64 bytes_transferred = 3;
}

// FileSystem is a service for controlling the FUSE filesystem inside a VM.
service FileSystem {
  // Prepare the filesystem for use.
  rpc Prepare(PrepareRequest) returns (PrepareResponse);

  // Stream the entries under the action's output paths to the host. Call it
  // before Finish, which stops fetching inputs that outputs may still need.
  rpc ReadOutputs(ReadOutputsRequest) returns (stream ReadOutputsResponse);

  // Upload the action's outputs to the cache through the host and return
  // their digests. Call it before Finish.
  rpc UploadOutputs(UploadOutputsRequest) returns (UploadOutputsResponse);

  // Finish any outstanding work (such as uploading data to the CAS).
  rpc Finish(FinishRequest) returns (FinishResponse);
}
