name: "Build Linux Github Release Artifacts"

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        default: "master"
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string
  workflow_call:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string

jobs:
  build:
    name: "Build Linux ${{ matrix.arch }} artifacts"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04-16cpu
            musl_output_platform: linux_x86_64_musl
            static_executor_target: executor_linux_amd64_static
          - arch: arm64
            runner: ubuntu-22.04-16cpu-arm64-arm-limited
            musl_output_platform: linux_arm64_musl
            static_executor_target: executor_linux_arm64_static
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.release_branch }}
          # We need to fetch git tags to obtain the latest version tag to report
          # the version of the running binary.
          fetch-depth: 0

      - name: Build and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bazelisk build \
            --config=release \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            //server/cmd/buildbuddy:buildbuddy \
            //enterprise/server/cmd/server:buildbuddy \
            //enterprise/server/cmd/executor:executor \
            //enterprise/server/cmd/executor:${{ matrix.static_executor_target }}
          cp bazel-bin/server/cmd/**/**/buildbuddy buildbuddy-linux-${{ matrix.arch }}
          cp bazel-bin/enterprise/server/cmd/**/**/buildbuddy buildbuddy-enterprise-linux-${{ matrix.arch }}
          cp bazel-bin/enterprise/server/cmd/**/**/executor executor-enterprise-linux-${{ matrix.arch }}
          cp bazel-out/${{ matrix.musl_output_platform }}-opt/bin/enterprise/server/cmd/**/**/executor executor-enterprise-linux-${{ matrix.arch }}-static
          gh release upload \
            ${{ inputs.version_tag }} \
            buildbuddy-linux-${{ matrix.arch }} \
            buildbuddy-enterprise-linux-${{ matrix.arch }} \
            executor-enterprise-linux-${{ matrix.arch }} \
            executor-enterprise-linux-${{ matrix.arch }}-static \
            --clobber
