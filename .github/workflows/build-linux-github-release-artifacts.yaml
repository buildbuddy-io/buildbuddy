name: "Build Linux Github Release Artifacts"

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        default: "master"
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string
      upload_artifacts:
        description: "Upload artifacts to the GitHub release. Uncheck to only build and smoke test."
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string
      upload_artifacts:
        description: "Upload artifacts to the GitHub release."
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: "Build Linux ${{ matrix.arch }} artifacts"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04-16cpu
            musl_output_platform: linux_x86_64_musl
            static_executor_target: executor_linux_amd64_static
          - arch: arm64
            runner: ubuntu-22.04-16cpu-arm64-arm-limited
            musl_output_platform: linux_arm64_musl
            static_executor_target: executor_linux_arm64_static
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.release_branch }}
          # We need to fetch git tags to obtain the latest version tag to report
          # the version of the running binary.
          fetch-depth: 0

      - name: Build Artifacts
        run: |
          bazelisk build \
            --config=release \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            //server/cmd/buildbuddy:buildbuddy \
            //enterprise/server/cmd/server:buildbuddy \
            //enterprise/server/cmd/executor:executor \
            //enterprise/server/cmd/executor:${{ matrix.static_executor_target }}
          cp bazel-bin/server/cmd/**/**/buildbuddy buildbuddy-linux-${{ matrix.arch }}
          cp bazel-bin/enterprise/server/cmd/**/**/buildbuddy buildbuddy-enterprise-linux-${{ matrix.arch }}
          cp bazel-bin/enterprise/server/cmd/**/**/executor executor-enterprise-linux-${{ matrix.arch }}
          cp bazel-out/${{ matrix.musl_output_platform }}-opt/bin/enterprise/server/cmd/**/**/executor executor-enterprise-linux-${{ matrix.arch }}-static

      # Run the executor smoke tests against the exact binaries we're about to
      # upload. Uses the same config as the build so the test-scoped app
      # server doesn't need to be rebuilt.
      - name: Smoke Test Executors
        run: |
          smoke_test() {
            bazelisk test \
              --config=release \
              --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
              --test_output=errors \
              --test_arg=--executor_binary="$PWD/$1" \
              --test_arg=--expected_version=${{ inputs.version_tag }} \
              "${@:2}" \
              //enterprise/server/test/smoke/local:local_test
          }
          smoke_test executor-enterprise-linux-${{ matrix.arch }}
          smoke_test executor-enterprise-linux-${{ matrix.arch }}-static --test_arg=--expect_static_binary

      - name: Upload Artifacts
        if: inputs.upload_artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            ${{ inputs.version_tag }} \
            buildbuddy-linux-${{ matrix.arch }} \
            buildbuddy-enterprise-linux-${{ matrix.arch }} \
            executor-enterprise-linux-${{ matrix.arch }} \
            executor-enterprise-linux-${{ matrix.arch }}-static \
            --clobber
