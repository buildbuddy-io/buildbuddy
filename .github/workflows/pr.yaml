name: PR

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04-16cpu
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Bazel Go module cache
        uses: ./.github/actions/setup-bazel-go-mod-cache

      - name: Test
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
          BUILDBUDDY_API_KEY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && secrets.BUILDBUDDY_ORG_API_KEY || '' }}
        run: |
          auth_args=()
          if [[ "$IS_FORK_PR" != "true" ]]; then
            : "${BUILDBUDDY_API_KEY:?BUILDBUDDY_ORG_API_KEY is required for trusted CI}"
            auth_args+=("--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY")
          fi
          bazelisk test \
            --config=untrusted-ci \
            "${auth_args[@]}" \
            //...
