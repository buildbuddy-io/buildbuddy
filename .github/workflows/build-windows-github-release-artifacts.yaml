name: "Build Windows Github Release Artifacts"

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        default: "master"
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string
  workflow_call:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.release_branch }}
          # We need to fetch git tags to obtain the latest version tag to report
          # the version of the running binary.
          fetch-depth: 0

      - name: Build and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $commonArgs = @(
            "--config=release-windows"
            "--remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}"
          )
          $amd64Target = "//enterprise/server/cmd/executor:executor_windows_amd64"
          $windows386Target = "//enterprise/server/cmd/executor:executor_windows_386"
          $windowsArm64Target = "//enterprise/server/cmd/executor:executor_windows_arm64"

          bazelisk --output_user_root=C:/0 build @commonArgs $amd64Target $windows386Target $windowsArm64Target
          Copy-Item -Path bazel-out/windows_amd64-opt/bin/enterprise/server/cmd/executor/executor_/executor.exe -Destination executor-enterprise-windows-amd64-beta.exe
          Copy-Item -Path bazel-out/windows_386-opt/bin/enterprise/server/cmd/executor/executor_/executor.exe -Destination executor-enterprise-windows-386-beta.exe
          Copy-Item -Path bazel-out/windows_arm64-opt/bin/enterprise/server/cmd/executor/executor_/executor.exe -Destination executor-enterprise-windows-arm64-beta.exe

          gh release upload ${{ inputs.version_tag }} executor-enterprise-windows-amd64-beta.exe executor-enterprise-windows-386-beta.exe executor-enterprise-windows-arm64-beta.exe --clobber
