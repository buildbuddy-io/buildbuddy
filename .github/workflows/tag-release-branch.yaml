name: "Tag release branch updates"

on:
  push:
    branches:
      - "bb_release_*"

permissions:
  contents: write

# Serialize runs per branch so concurrent pushes don't pick the same patch version.
concurrency:
  group: tag-release-branch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    # The internal cut-release workflow creates the initial minor-version tag.
    if: ${{ !github.event.created && !github.event.deleted && !github.event.forced }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.after }}
          fetch-depth: 0
          token: ${{ secrets.BUILDBUDDY_GITHUB_USER_TOKEN }}

      - name: Create patch version tag
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD already has a version tag; nothing to do."
            exit 0
          fi
          previous_version=$(./tools/latest_version_tag.sh --merged HEAD)
          if [[ -z "$previous_version" ]]; then
            echo "No version tag found in release branch history." >&2
            exit 1
          fi
          git config --local user.email "github-actions-release-bot@users.noreply.github.com"
          git config --local user.name "github-actions-release[bot]"
          ./release.py --auto --force --bump_version_type=patch --base_version="$previous_version"
