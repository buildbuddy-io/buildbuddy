# TODO: remove this workflow once firecracker is generally available on arm64.
name: "Test linux/arm64 (root tests)"

on:
  push:
    branches:
      - "master"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04-16cpu-arm64-arm-limited
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Bazel Go module cache
        uses: ./.github/actions/setup-bazel-go-mod-cache

      # podman_test installs its own version of podman under / in order to test
      # the same version that we use in the executor while not having to
      # configure various podman directory paths. For now just uninstall the
      # podman installation that already comes with the GH actions runner.
      - name: Uninstall podman
        run: |
          sudo apt-get remove -y podman
          # Hack to work around https://github.com/containers/podman/issues/9164
          find /dev/shm -name 'libpod*' | xargs -r sudo rm -rf

      - name: Run tests
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
          BUILDBUDDY_API_KEY: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.BUILDBUDDY_ORG_API_KEY || '' }}
        run: |
          if [[ "$IS_FORK_PR" != "true" ]]; then
            : "${BUILDBUDDY_API_KEY:?BUILDBUDDY_ORG_API_KEY is required for trusted CI}"
          fi
          cat >> user.bazelrc <<'EOF'
          common --config=cache
          common --repository_cache=~/repo-cache
          common --bes_backend=remote.buildbuddy.io
          common --bes_results_url=https://app.buildbuddy.io/invocation/
          common --experimental_remote_downloader=remote.buildbuddy.io
          common --remote_cache=remote.buildbuddy.io
          common --flaky_test_attempts=3
          common --local_test_jobs=1
          common --build_metadata=ROLE=CI
          common --build_metadata=DISABLE_COMMIT_STATUS_REPORTING=true
          common --color=yes
          EOF

          if [[ "$IS_FORK_PR" == "true" ]]; then
            echo 'common --remote_instance_name=buildbuddy-io/buildbuddy/untrusted-ci-arm64/rin20260818' >> user.bazelrc
          else
            printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" >> user.bazelrc
          fi

          bazelisk test --config=race --test_tag_filters= \
            //enterprise/server/remote_execution/vbd:vbd_test \
            //enterprise/server/test/integration/podman:podman_test
