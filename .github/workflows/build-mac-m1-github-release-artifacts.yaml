name: "Build Mac-M1 Github Release Artifacts"

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        default: "master"
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string
      upload_artifacts:
        description: "Upload artifacts to the GitHub release. Uncheck to only build and smoke test."
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string
      upload_artifacts:
        description: "Upload artifacts to the GitHub release."
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-15-xlarge
    defaults:
      run:
        shell: "/usr/bin/arch -arch arm64e /bin/bash --noprofile --norc -eo pipefail {0}"
    steps:
      - name: Clean workspace
        run: |
          set -x
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.release_branch }}
          # We need to fetch git tags to obtain the latest version tag to report
          # the version of the running binary.
          fetch-depth: 0

      - name: Build Artifacts
        env:
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
        run: |
          bazelisk build \
            --config=release-m1 \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            //enterprise/server/cmd/server:buildbuddy \
            //enterprise/server/cmd/executor:executor
          cp bazel-bin/enterprise/server/cmd/**/**/buildbuddy buildbuddy-enterprise-darwin-arm64
          cp bazel-bin/enterprise/server/cmd/**/**/executor executor-enterprise-darwin-arm64

      # Run the executor smoke tests against the exact binary we're about to
      # upload. Uses the same config as the build so the test-scoped app
      # server doesn't need to be rebuilt.
      - name: Smoke Test Executor
        env:
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
        run: |
          bazelisk test \
            --config=release-m1 \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --test_output=errors \
            --test_arg=--executor_binary="$PWD/executor-enterprise-darwin-arm64" \
            --test_arg=--expected_version=${{ inputs.version_tag }} \
            //enterprise/server/test/smoke/local:local_test

      - name: Upload Artifacts
        if: inputs.upload_artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            ${{ inputs.version_tag }} \
            buildbuddy-enterprise-darwin-arm64 \
            executor-enterprise-darwin-arm64 \
            --clobber
