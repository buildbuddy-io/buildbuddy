name: "Build Linux arm64 Github Release Artifacts"

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        default: "master"
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string
  workflow_call:
    inputs:
      release_branch:
        description: "Git branch to checkout."
        required: true
        type: string
      version_tag:
        description: "Version to tag release artifacts."
        required: true
        type: string

jobs:
  build:
    # Build on amd64 and cross-compile so frontend tools such as SWC can use
    # their available linux-x64 binaries.
    runs-on: ubuntu-22.04-16cpu
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.release_branch }}
          # We need to fetch git tags to obtain the latest version tag to report
          # the version of the running binary.
          fetch-depth: 0

      - name: Build and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bazelisk build \
            --config=release \
            --platforms=@toolchains_buildbuddy//platforms:linux_arm64 \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            //enterprise/server/cmd/server:buildbuddy \
            //enterprise/server/cmd/executor:executor
          cp bazel-bin/enterprise/server/cmd/**/**/buildbuddy buildbuddy-enterprise-linux-arm64
          cp bazel-bin/enterprise/server/cmd/**/**/executor executor-enterprise-linux-arm64
          gh release upload \
            ${{ inputs.version_tag }} \
            buildbuddy-enterprise-linux-arm64 \
            executor-enterprise-linux-arm64 \
            --clobber
