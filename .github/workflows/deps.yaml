name: Update Deps

on:
  push:
    branches:
      - master
      - "bb_release_*"
    paths-ignore:
      - "docs/**"
      - "website/**"

# Run in push order per branch, so a retried push can't move the pin backwards.
concurrency:
  group: update-deps-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'deps skip')"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: buildbuddy

      - name: Checkout internal
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: "buildbuddy-io/buildbuddy-internal"
          # Fails if the internal branch doesn't exist.
          ref: ${{ github.ref_name }}
          token: ${{ secrets.BUILDBUDDY_APP_TOKEN }}
          persist-credentials: false
          path: buildbuddy-internal

      - name: Update internal and push
        env:
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          BRANCH: ${{ github.ref_name }}
          PUSH_TOKEN: ${{ secrets.BUILDBUDDY_GITHUB_USER_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"/buildbuddy-internal
          git config --local user.email "$AUTHOR_EMAIL"
          git config --local user.name "$AUTHOR_NAME"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/buildbuddy-io/buildbuddy-internal.git"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "Push rejected; retrying (attempt $attempt of 3)"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cp ../buildbuddy/deps.bzl deps.bzl
            cp ../buildbuddy/.bazelversion .bazelversion
            cp ../buildbuddy/shared.bazelrc shared.bazelrc
            cp ../buildbuddy/bazel_downloader.cfg bazel_downloader.cfg
            mkdir -p buildpatches/bazel_dep
            cp ../buildbuddy/buildpatches/bazel_dep/* buildpatches/bazel_dep/
            mkdir -p deps
            cp ../buildbuddy/deps/* deps/
            cp ../buildbuddy/MODULE.bazel.lock MODULE.bazel.lock

            sed -i "s/commit = \"[a-z0-9]*\",  # autoupdate buildbuddy-io\/buildbuddy/commit = \"$GITHUB_SHA\",  # autoupdate buildbuddy-io\/buildbuddy/g" MODULE.bazel
            bazel mod deps --lockfile_mode=update

            git add deps.bzl .bazelversion shared.bazelrc bazel_downloader.cfg buildpatches deps MODULE.bazel.lock
            # E.g. a new release branch whose internal branch already pins this commit.
            if git diff --quiet HEAD; then
              echo "Internal $BRANCH is already up to date"
              exit 0
            fi
            cat <<EOF > "$RUNNER_TEMP/message.txt"
          🔄 $COMMIT_MESSAGE
          Update buildbuddy-io/buildbuddy commit SHA

          🔗 $COMMIT_URL
          EOF
            git commit -F "$RUNNER_TEMP/message.txt" -a

            if git push origin "HEAD:refs/heads/$BRANCH"; then
              exit 0
            fi
          done
          echo "Failed to push after 3 attempts"
          exit 1
